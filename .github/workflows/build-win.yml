# ============================================================================
# Windows 桌面版构建（PyInstaller 不能跨平台编译 → exe 必须在 Windows 上构建）
# ============================================================================
# 触发方式：
#   1. 手动：Actions 页面 → Build Windows → Run workflow（选分支，默认 app-dev）
#   2. 打 tag：git tag v1.0.69 && git push origin v1.0.69（正式发 Windows 版时用）
#
# 产物（artifact：windows-installer）：
#   - dist/VideoDownloader-Setup-<ver>.exe   Inno Setup 单文件安装程序（正式分发用这个）
#   - dist/VideoDownloader-onedir-<ver>.zip  onedir 文件夹打包（排障/手动验证用）
#
# 解说管线（commentary-pipeline，私有仓）：
#   - 配置 secret COMMENTARY_PAT（fine-grained PAT，仅需 Contents: Read on
#     leydall0999-cell/commentary-pipeline）即自动捆绑；
#   - 未配置时构建**无解说管线**的版本（日志与 Summary 会明确标注），
#     其余功能（下载/嗅探/字幕/去水印/抠图）不受影响。
#
# 发版链路提醒：本 workflow 只产 artifact，不碰 R2 / latest.json / 官网。
# 发布动作由本机按项目铁律执行（用户审核 changelog 后才替换线上文件）。
# ============================================================================

name: build-win

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "构建分支（默认 app-dev）"
        required: false
        default: "app-dev"
      commentary:
        description: "解说管线：auto=有 PAT 就捆 / force-skip=明确不捆"
        type: choice
        options: [auto, force-skip]
        default: auto
  push:
    tags: ["v*"]

jobs:
  build:
    name: pyinstaller + innosetup
    runs-on: windows-latest
    timeout-minutes: 60
    # contents:write 仅用于「失败时把构建日志回推 ci-logs 分支」
    # （本机无 gh token、匿名 API 下载 artifact/logs 均 401/403，
    #  这是唯一完全自主的 CI 排障通道）
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      # runner 在海外：用官方 PyPI（阿里源跨境不稳）
      PIP_INDEX: "https://pypi.org/simple/"
    steps:
      - name: Checkout 主仓
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0 # build_version.txt 要取 git short-sha

      # ── 解说管线（私有仓，需 COMMENTARY_PAT；缺省跳过）──
      # checkout 到 <workspace>/commentary-pipeline，正好是 build_win.sh 的
      # 默认候选路径 COMMENTARY_PIPELINE_DIR=$REPO/../commentary-pipeline
      #
      # 🔴 2026-10-16 实测教训（两个变体跑一轮才定位到）：step 级 if 里
      # **绝对不能引用 secrets**——未配置的 secret 在 workflow 编译期就让整个
      # workflow 无法实例化 job（现象：run 秒败、jobs 数 0、无任何日志）。
      # 现在 if 只判断 inputs；secrets 放 with.token 里（运行时求值），
      # 没有 PAT 时 checkout 私有仓会失败 → continue-on-error 吞掉 →
      # build_win.sh 找不到管线 → 构建无解说版（Summary 有明确标注）。
      - name: Checkout 解说管线（可选）
        if: ${{ github.event.inputs.commentary != 'force-skip' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: leydall0999-cell/commentary-pipeline
          token: ${{ secrets.COMMENTARY_PAT }}
          path: commentary-pipeline
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # 不配 cache: pip —— 实测 Post step 会偶发失败（无 lock 文件时 cache
          # 保存报错），且本 workflow 每次全量 pip install，缓存收益有限

      # 镜像通常自带 ffmpeg；探测不到再装（choco 幂等）
      - name: Ensure ffmpeg/ffprobe in PATH
        shell: pwsh
        run: |
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            Write-Host "ffmpeg already present: $((ffmpeg -version | Select-Object -First 1))"
          } else {
            Write-Host "installing ffmpeg via chocolatey..."
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      # aria2c 由 desktop/bundle_aria2.py 从 GitHub release 自动下载 Windows 版；
      # deno.exe 由 pip 的 deno 包提供（build_win.sh --add-binary 进包）

      - name: Build (pyinstaller onedir + innosetup)
        # tee 落一份日志 + PIPESTATUS 显式取 build_win.sh 真实退出码
        # （不依赖 pipefail；失败时下一步把日志传成 artifact，匿名 API 可下载）
        run: |
          bash desktop/build_win.sh 2>&1 | tee build_win.log
          exit "${PIPESTATUS[0]}"
        working-directory: ${{ github.workspace }}

      - name: 上传构建日志（成败都传，用于排障）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_win.log
          retention-days: 7
          if-no-files-found: warn

      # 失败时把日志推回仓库 ci-logs 分支——本机 git fetch 即可读，
      # 不依赖任何 token 配置（GITHUB_TOKEN 由 Actions 自动提供）
      - name: 失败回推构建日志到 ci-logs 分支
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git checkout -B ci-logs
          mkdir -p ci-logs
          cp build_win.log "ci-logs/build_win_$(date +%Y%m%d_%H%M%S).log" 2>/dev/null || true
          # 把 smoke/zip/summary 等后续步骤没跑到时的环境信息也带上
          {
            echo "=== run: ${{ github.run_id }} sha: ${{ github.sha }} ==="
            echo "=== python ==="; python --version 2>&1
            echo "=== ffmpeg ==="; ffmpeg -version 2>&1 | head -1
            echo "=== iscc ==="; command -v iscc || echo "(iscc 不在 PATH)"
            echo "=== commentary-pipeline 目录 ==="; ls commentary-pipeline/ 2>&1 | head -5 || echo "(不存在)"
          } > "ci-logs/env_$(date +%Y%m%d_%H%M%S).txt"
          git add ci-logs/
          git commit -m "ci: build log $(date +%Y%m%d_%H%M%S)" || echo "无变更可提交"
          git push -f origin ci-logs

      # ── Smoke test：exe 起后轮询后端端口 ──
      # 无头 runner 上 pywebview(winforms) 可能起不来窗口，但 server_thread 独立，
      # 8321 能响应就证明冻结包的后端完整可用。失败不阻断（可能是无头限制），
      # 结果如实写进 Summary。
      - name: Smoke test (backend port)
        id: smoke
        continue-on-error: true
        run: |
          ./dist/VideoDownloader/VideoDownloader.exe &
          CODE="000"
          for i in $(seq 1 40); do
            sleep 3
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8321/api/version || echo 000)
            [ "$CODE" = "200" ] && break
            # 进程存活检测用只读 tasklist（// 转义）；taskkill 返回 0=杀成功，不能用来判活
            if ! tasklist //FI "IMAGENAME eq VideoDownloader.exe" 2>/dev/null | grep -qi videodownload; then
              echo "process exited at ~$((i*3))s"; break
            fi
          done
          echo "http_code=$CODE"
          echo "--- /api/version ---"
          curl -s --max-time 5 http://127.0.0.1:8321/api/version || echo "(no response)"
          echo
          echo "--- /api/system/info (platform 应为 windows) ---"
          curl -s --max-time 5 http://127.0.0.1:8321/api/system/info || echo "(no response)"
          echo
          taskkill //F //IM VideoDownloader.exe >/dev/null 2>&1 || true
          [ "$CODE" = "200" ] || exit 1

      - name: 打包 onedir zip（排障/手动验证用）
        run: |
          cd dist
          VER="$(cat VideoDownloader/version.txt | tr -d '[:space:]')"
          powershell -Command "Compress-Archive -Path VideoDownloader -DestinationPath VideoDownloader-onedir-${VER}.zip -Force"
          ls -la VideoDownloader-onedir-*.zip VideoDownloader-Setup-*.exe
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          # 解说管线是否真捆进包：以产物目录为准（比 secret 存在性更准确的事实判断）
          if [ -d "dist/VideoDownloader/_internal/commentary" ] || [ -d "dist/VideoDownloader/commentary" ]; then
            PL="✅ 已捆绑"; else PL="❌ 未捆绑（无 COMMENTARY_PAT、被强制跳过或 checkout 失败）"; fi
          {
            echo "## Windows 构建结果"
            echo ""
            echo "- 版本: \`$(cat VERSION | tr -d '[:space:]')\` (commit \`${{ github.sha }}\`)"
            echo "- Smoke test: ${{ steps.smoke.outcome == 'success' && '✅ 8321 响应 200' || '⚠️ 未通过（可能是无头环境限制，见日志）' }}"
            echo "- 解说管线: ${PL}"
            echo ""
            echo "| 产物 | 大小 |"
            echo "|---|---|"
            for f in dist/VideoDownloader-Setup-*.exe dist/VideoDownloader-onedir-*.zip; do
              [ -f "$f" ] && echo "| \`$(basename $f)\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/VideoDownloader-Setup-*.exe
            dist/VideoDownloader-onedir-*.zip
          retention-days: 14
          if-no-files-found: error
