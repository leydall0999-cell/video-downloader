name: cleanup-win-releases

# 为什么需要它：
#   CI 每成功构建一次 Windows 安装包，就会在 Release 里留一个 v*-win* 标签 +
#   一个 130~190MB 的 exe asset。仓库是**公开**的，长期跑下去会堆一串历史包，
#   其中夹着「无解说版」这种已被取代的构建 —— 用户从 Releases 页误下的风险实在。
#   本 workflow 只保留最新的 N 个，其余连 Release 带 git tag 一起删掉。
#
# 用法：
#   1) 推 tag（N 由 tag 名给出）：git push origin cleanup-win-1   → 只留最新 1 个
#   2) Actions 页面 → cleanup-win-releases → Run workflow，填 keep
#
# ⚠️ 不会碰非 win 形态的 tag/release（正则 ^v[0-9.]+-win[0-9]+$）。
# ⚠️ 删除 Release 用 --cleanup-tag，git tag 一并删除；别在构建进行中去删当前 tag。

on:
  push:
    tags: ["cleanup-win-*"]
  workflow_dispatch:
    inputs:
      keep:
        description: "保留最新的几个 win 版 Release"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 没有 checkout 步骤，gh 无法从 git remote 推断仓库 → 显式给
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 删除较旧的 win 版 Release（保留最新 N 个）
        run: |
          set -euo pipefail
          KEEP="${{ github.event.inputs.keep || '1' }}"
          case "$KEEP" in ''|*[!0-9]*) echo "keep 必须是数字，收到：$KEEP"; exit 1;; esac
          echo "== 现有 Release（新→旧）=="
          gh release list --limit 100 --json tagName,createdAt \
            -q '.[] | "\(.createdAt)\t\(.tagName)"'
          TAGS="$(gh release list --limit 100 --json tagName,createdAt \
            -q '.[] | select(.tagName | test("^v[0-9.]+-win[0-9]+$")) | .tagName')"
          echo
          echo "== 处理（保留最新 $KEEP 个）=="
          I=0
          printf '%s\n' "$TAGS" | while IFS= read -r t; do
            if [ -z "$t" ]; then continue; fi
            I=$((I + 1))
            if [ "$I" -le "$KEEP" ]; then
              echo "保留 $t"
            else
              echo "删除 $t"
              gh release delete "$t" --yes --cleanup-tag
            fi
          done
          echo
          echo "== 清理后 =="
          gh release list --limit 100
