# 扫码分享服务（vdl-share）在 8888 端口上按域名分流
# 为什么要这样：阿里云安全组只放行 8888，不能再起新端口（见 vdl-gateway 同名注释）。
# 公网入口：https://share.hanyuxz.top  --Cloudflare 橙云-->  本机 8888
# 大文件（>100MB）走 CF 会被拒（免费版请求体上限 100MB），
# 桌面端会自动改用 http://8.138.223.3:8888 直连通道上传。

server {
    listen 8888;
    server_name share.hanyuxz.top;

    # 单文件上限 2GB（与 share_server.py 的 VDL_SHARE_MAX_FILE 保持一致）
    client_max_body_size 2048m;
    client_body_timeout 1800s;

    access_log /var/log/nginx/share.access.log combined;

    # ---- 隐藏内部文件：上传临时体与元信息不可被外部拉取 ----
    location ~ ^/f/.*(\.uploading|meta\.json)$ {
        return 404;
    }

    # ---- 动态接口：上传 / 元信息 / 删除 / 分享页 / 健康检查 ----
    location ~ ^/(api/|s/|healthz) {
        proxy_pass http://127.0.0.1:8901;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传必须流式转发：否则 nginx 会先把整份文件写进临时盘，1.6G 内存的小机器扛不住
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ---- 文件字节：由 nginx 直出，原生支持 Range（微信里视频才能拖动/续传）----
    location /f/ {
        alias /opt/vdl-share/data/;
        autoindex off;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=604800" always;
        limit_except GET HEAD { deny all; }
    }

    location = /favicon.ico { return 204; }
}
