# WebSocket 升级映射（必须放在 nginx 的 http 上下文）
# Debian 的 nginx.conf 默认 include /etc/nginx/conf.d/*.conf，直接丢进去即可。
#
# 作用：把 `Connection` 头按需设成 upgrade / close。
#   - 客户端带 Upgrade 头 → connection_upgrade = upgrade（WS 正常握手）
#   - 普通请求（含 upstream keepalive）→ close
# 直接写死 `Connection ""` 会破坏 WebSocket 升级（2026-09-21 实测踩过：
# /ws/cn-tunnel 变成普通 GET → 404 → 国内隧道客户端无限重连）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
