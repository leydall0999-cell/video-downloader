# nginx 反代模板（由 deploy/remote_setup.sh 注入 __PORT__ / __DOMAIN__ 后启用）
#
# 为什么需要这一层：
#   Cloudflare 橙云回源走的是**标准端口**（http → origin:80 / https → origin:443），
#   而应用只监听 APP_PORT(8080)。没有 nginx，`https://<域名>` 会直接 521。
#   注意区分：`http://<域名>:8080` 走的是 CF 的「8080 代理端口」（同端口回源），
#   不经过本文件的 80/443，所以那种写法在没装 nginx 时也能通。
#
# 证书：自签即可 —— 只要 Cloudflare SSL/TLS 模式是 Full（非 Full-strict），
#   CF 不回源校验证书。若被改成 Full(strict)，这里会变成 526，需换正式证书。

upstream vdl_app {
    server 127.0.0.1:__PORT__;
    keepalive 32;
}

server {
    listen      80  default_server;
    listen [::]:80  default_server;
    listen      443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name __DOMAIN__ _;

    ssl_certificate     /etc/nginx/ssl/vdl.crt;
    ssl_certificate_key /etc/nginx/ssl/vdl.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 视频上传/下载：关缓冲、放宽体积与超时，避免大文件被截断
    client_max_body_size     0;
    client_body_timeout      3600s;
    proxy_buffering          off;
    proxy_request_buffering  off;
    proxy_connect_timeout    60s;
    proxy_send_timeout       3600s;
    proxy_read_timeout       3600s;
    proxy_http_version       1.1;

    location / {
        proxy_pass http://vdl_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级必须原样放行 —— `/ws/cn-tunnel` 反向隧道就靠它。
        # ⚠️ 不能写死 `Connection ""`（那会吃掉 Upgrade 头）：隧道握手会被退化成
        #    普通 GET → Starlette 路由不匹配 → 返回 404，国内 ECS 的隧道客户端
        #    报 "server rejected WebSocket connection: HTTP 404" 并 5s 一次死循环重连。
        #    $connection_upgrade 来自 conf.d/ws_upgrade.conf 的 map。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
